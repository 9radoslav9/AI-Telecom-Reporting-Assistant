name: CI

on:
  push:
    branches: ["main", "v2-dev"]
  pull_request:
    branches: ["main", "v2-dev"]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Свали кода от repo-то
        uses: actions/checkout@v7

      - name: Инсталирай Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Инсталирай зависимостите (чист install)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Линтинг - реални грешки (спира build-а)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Линтинг - пълен стилов доклад (само информативен)
        run: flake8 . --count --exit-zero --max-line-length=120 --statistics

      - name: Import проверка - хваща липсващ пакет в requirements.txt
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -c "import app; print('OK - всички импорти минаха чисто')"